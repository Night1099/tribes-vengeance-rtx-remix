; remix-comp-proxy configuration (d3d9.dll proxy)
; Adapted from xoxor4d/remix-comp-base by kim2091 for Vibe Reverse Engineering
;
; Numbers are decimal: write ViewStart=8, not c8 or 0x8. A ";" comment may
; follow a number on its line. A value that is not a number is reported in
; rtx_comp\console.log and the setting keeps its default. Switches are 1 or 0.

[Remix]
Enabled=1
DLLName=d3d9_remix.dll

; ============================================================
; DLL/ASI Chain Loading
;
; PreLoad:  Loaded during DllMain, before the d3d9 chain.
; PostLoad: Loaded after the game window is found.
;
; Semicolon-separated. Paths relative to the game directory.
; Supports .dll and .asi files.
;
; Example: PreLoad=patch.dll;fix.asi
; ============================================================
[Chain]
PreLoad=
PostLoad=

; ============================================================
; FFP Conversion Settings
;
; Set Enabled=0 to disable FFP conversion entirely (passthrough mode).
; Useful for tracing or non-FFP mods.
; ============================================================
[FFP]
Enabled=1
AlbedoStage=0

; ============================================================
; Level Lights
;
; Enabled=1: every light actor of the loaded level is sent to
; Direct3D each frame, in place of the few lights the engine
; sends for dynamically lit meshes near the player. Without it a
; light only exists for Remix once the player has walked into
; its range.
;
; Intensity scales the colour of every submitted light. The
; engine draws lit surfaces at twice the light's colour, so 2.0
; matches the game's own balance; tune by eye.
;
; IgnoreClasses: lights carried by actors whose class name
; contains one of these words are left out; comma separated,
; upper and lower case alike. "Jetpack" covers the jetpack flame
; of every armour (FX_ImperialMedium_JetPack, ...). The file
; rtx_comp/console.log names each class the first time one of its
; actors has a light: "[Lights] Light actors of class".
; ============================================================
[Lights]
Enabled=1
Intensity=2.0
IgnoreClasses=Jetpack

; ============================================================
; Engine Effects
;
; DisableGlow: 1 = the engine's glow post-process is switched off
; (patched in memory at startup). It redraws the scene and pastes a copy of
; the rasterized frame over the image, which a path-traced frame
; has no use for, and its buffers overflow once culling is off:
; keep this at 1 while any [Culling] switch is 1.
;
; DisableDynamicShadows: 1 = the engine's projected character
; shadows are switched off (patched in memory at startup). Each
; one renders its character again into a texture and projects it
; onto the ground, which Remix shows as an opaque plane beneath
; every character. The path tracer casts the real shadows.
; Decals are not affected.
;
; WholeBspSections: 1 = level geometry (walls, floors, ceilings)
; is drawn a whole section at a time, in a fixed order. The
; engine otherwise rebuilds each section every frame from the
; surfaces facing the camera, nearest first, so Remix sees a new
; mesh (a new hash) after every step and replacements, lights and
; material tags attached to it do not stick. Switching this
; changes the hash of every piece of level geometry.
;
; FixedFunctionTerrain: 1 = terrain blends its ground layers on
; the texture stages instead of in a pixel shader, so every
; terrain draw starts with a ground texture Remix can show and
; tag (Game Setup > Terrain Textures; the terrain baker then
; blends the layers). With 0 most terrain draws start with a
; weight map generated when the map loads. Applies to maps
; loaded after the game starts.
; ============================================================
[Engine]
DisableGlow=1
DisableDynamicShadows=1
WholeBspSections=1
FixedFunctionTerrain=1

; ============================================================
; Meshes
;
; CentrePivots: 1 = every static mesh is given an origin at the
; centre of its geometry (the engine's origin is often far
; outside the mesh). A light or replacement attached to a mesh
; in the Remix Toolkit then sits on the mesh. Nothing moves on
; screen, but every static mesh becomes another mesh for Remix:
; its hash changes, so captures and replacements made with one
; setting do not apply with the other. Keep it the same when
; capturing and when playing.
; ============================================================
[Meshes]
CentrePivots=1

; ============================================================
; Engine Culling
;
; Each switch patches Engine.dll in memory at startup so the
; renderer submits geometry it would otherwise cull. A path
; tracer needs what is off screen and behind walls for shadows,
; reflections and bounce light.
;
; FullScene:       1 = the whole level is drawn every frame: every
;                  zone gets the whole view and every actor is
;                  drawn, whatever KeepRadius says. Use it for
;                  Remix Toolkit captures, which then hold the
;                  complete level. Costs a lot of frame rate on
;                  large maps. 0 = KeepRadius decides.
; DisableFrustum:  1 = view-frustum and antiportal (occluder)
;                  tests for level geometry, actors, static
;                  meshes, terrain, decorations and sky faces are
;                  switched off.
; DisableDistance: 1 = actors past their cull distance are drawn.
;
; KeepRadius:      with DisableFrustum=1 and FullScene=0, every
;                  static and skeletal mesh actor within this many
;                  units of the camera is drawn, and so is one
;                  farther away whose radius is at least
;                  KeepAngularSize times its distance (large
;                  buildings and rocks stay for shadows and bounce
;                  light). Other mesh actors are left to the
;                  engine's own visibility: the view, zones seen
;                  through portals, antiportals. 0 = every actor
;                  is drawn. KeepRadius never culls level geometry
;                  (BSP), terrain, decorations or effects. Each
;                  actor drawn costs the game and the Remix bridge
;                  a few microseconds; large outdoor levels have
;                  thousands.
; ============================================================
[Culling]
FullScene=0
DisableFrustum=1
DisableDistance=1
KeepRadius=8000
KeepAngularSize=0.05

; ============================================================
; Vertex Shader Constant Registers
;
; Where the game uploads its View, Projection and World matrices
; with SetVertexShaderConstantF. Start is the first register of a
; matrix and End is one past its last, always Start + 4: a 4x4
; matrix in c8-c11 is Start=8, End=12. With skinning enabled, every
; matrix has to lie below BoneThreshold.
;
; find_matrix_registers.py suggests a layout. Confirm it with a
; live trace or a frame capture before relying on it.
; ============================================================
[FFP.Registers]
ViewStart=0
ViewEnd=4
ProjStart=4
ProjEnd=8
WorldStart=16
WorldEnd=20

; ============================================================
; Skinning (OFF by default)
;
; Only enable after rigid FFP geometry works correctly.
; See documentation for skinning setup workflow.
;
; A SetVertexShaderConstantF upload is taken as the bone palette
; when it starts at register BoneThreshold or above, covers at
; least BoneMinRegs registers and holds a whole number of bones.
; RegsPerBone is 3 for packed 4x3 bone matrices and 4 for 4x4.
; find_skinning.py suggests BoneThreshold and RegsPerBone.
; ============================================================
[Skinning]
Enabled=0
BoneThreshold=20
RegsPerBone=3
BoneMinRegs=3

; ============================================================
; Diagnostic Logging
;
; AutoCapture: Writes rtx_comp\diagnostics.log after DelayMs milliseconds.
; Logs LogFrames frames of draw call data for debugging.
; The delay ensures the game is in-game with real geometry.
;
; On-demand capture is always available from the ImGui overlay
; (F4 -> Diagnostics tab) regardless of AutoCapture setting.
;
; Log categories control what data is captured.
; All categories default to ON. Disable to reduce log noise.
; ============================================================
[Diagnostics]
Enabled=1
AutoCapture=0
DelayMs=50000
LogFrames=3
LogDrawCalls=1
LogVSConstants=1
LogVertexData=1
LogDeclarations=1
LogTextures=1
LogPresentInfo=1

; ============================================================
; Frame Tracer
;
; Integrated D3D9 call tracer. Captures all API calls to JSONL
; for offline analysis with:
;   python -m graphics.directx.dx9.tracer analyze <file.jsonl> --summary
;
; FFP is automatically disabled during capture to record
; the game's unmodified calls.
; ============================================================
[Tracer]
BacktraceDepth=8
OutputDir=captures
